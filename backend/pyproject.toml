[project]
name = "sloty"
version = "1.0.0"
description = "An online scheduling and booking platform designed to simplify appointment management for any business."
readme = "README.md"
authors = [
    { name = "Kevin Marquez", email = "kammper10@gmail.com" }
]
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.141.1",
    "pydantic-settings>=2.15.0",
    "uvicorn>=0.53.0",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.ruff]
target-version = "py313"
line-length = 90
src = ["src", "tests"]

[tool.ruff.lint]
extend-select = ["I"]

[tool.pytest]
testpaths = ["tests"]